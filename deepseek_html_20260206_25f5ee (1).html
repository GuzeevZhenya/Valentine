<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разбей стену любви! 🎮❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #8a2be2, #da70d6);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .title {
            font-size: 2.5rem;
            color: white;
            text-shadow: 3px 3px 0 #4b0082;
            margin-bottom: 1rem;
            text-align: center;
        }
        .game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: rgba(255,255,255,0.1);
            border: 3px solid white;
            border-radius: 10px;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            background: rgba(0,0,0,0.2);
        }
        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        button {
            background: white;
            color: #8a2be2;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .score-board {
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.5rem;
            color: #8a2be2;
            font-weight: bold;
        }
        .hearts-left {
            font-size: 1.8rem;
            color: white;
            text-shadow: 2px 2px 0 #4b0082;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .game-over.show {
            display: block;
            animation: popIn 0.5s;
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            80% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .instructions {
            color: white;
            margin-top: 1rem;
            text-align: center;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <h1 class="title">Разбей стену любви! 🎮❤️</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="game-over" id="gameOver">
            <h2 style="color:#8a2be2; margin-bottom:20px;">🎉 Уровень пройден! 🎉</h2>
            <p style="font-size:1.3rem; margin-bottom:30px;">Твой счет: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Играть ещё! 🔄</button>
        </div>
    </div>
    <div class="controls">
        <div class="hearts-left">❤️ x <span id="lives">3</span></div>
        <button onclick="startGame()">Старт ▶️</button>
        <div class="score-board">Очки: <span id="score">0</span></div>
        <button onclick="pauseGame()">Пауза ⏸️</button>
    </div>
    <div class="instructions">
        Используй ← → или мышку для управления платформой
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Игровые переменные
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let gamePaused = false;
        
        // Платформа
        const platform = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 20,
            width: 100,
            height: 15,
            speed: 8,
            dx: 0
        };
        
        // Мяч
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 40,
            radius: 10,
            speed: 5,
            dx: 5 * (Math.random() > 0.5 ? 1 : -1),
            dy: -5
        };
        
        // Кирпичики-сердечки
        const brickRowCount = 5;
        const brickColumnCount = 10;
        const brickWidth = 70;
        const brickHeight = 30;
        const brickPadding = 5;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 25;
        
        const bricks = [];
        
        // Создаем кирпичики
        function createBricks() {
            bricks.length = 0;
            
            for(let r = 0; r < brickRowCount; r++) {
                bricks[r] = [];
                for(let c = 0; c < brickColumnCount; c++) {
                    const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    
                    // Случайный цвет
                    const colors = ['#FF6B8B', '#FF8E53', '#FFCE00', '#4ECDC4', '#45B7D1'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    bricks[r][c] = {
                        x: brickX,
                        y: brickY,
                        width: brickWidth,
                        height: brickHeight,
                        color: color,
                        visible: true
                    };
                }
            }
        }
        
        // Рисуем платформу
        function drawPlatform() {
            ctx.beginPath();
            ctx.rect(platform.x, platform.y, platform.width, platform.height);
            ctx.fillStyle = '#8a2be2';
            ctx.fill();
            ctx.closePath();
            
            // Добавляем сердечко на платформу
            ctx.font = '20px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText('❤️', platform.x + platform.width / 2, platform.y + 12);
        }
        
        // Рисуем мяч
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFCE00';
            ctx.fill();
            ctx.closePath();
            
            // Рисуем сердечко на мяче
            ctx.font = '15px Arial';
            ctx.fillStyle = '#8a2be2';
            ctx.textAlign = 'center';
            ctx.fillText('💛', ball.x, ball.y + 5);
        }
        
        // Рисуем кирпичики
        function drawBricks() {
            bricks.forEach(row => {
                row.forEach(brick => {
                    if(brick.visible) {
                        ctx.beginPath();
                        ctx.rect(brick.x, brick.y, brick.width, brick.height);
                        ctx.fillStyle = brick.color;
                        ctx.fill();
                        ctx.closePath();
                        
                        // Рисуем сердечко на кирпичике
                        ctx.font = '20px Arial';
                        ctx.fillStyle = 'white';
                        ctx.textAlign = 'center';
                        ctx.fillText('❤️', brick.x + brick.width / 2, brick.y + brick.height / 2 + 8);
                    }
                });
            });
        }
        
        // Обновляем счет
        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
        }
        
        // Движение платформы
        function movePlatform() {
            platform.x += platform.dx;
            
            // Границы платформы
            if(platform.x < 0) platform.x = 0;
            if(platform.x + platform.width > canvas.width) {
                platform.x = canvas.width - platform.width;
            }
        }
        
        // Движение мяча
        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Отскок от стен
            if(ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx *= -1;
            }
            
            // Отскок от потолка
            if(ball.y - ball.radius < 0) {
                ball.dy *= -1;
            }
            
            // Отскок от платформы
            if(
                ball.y + ball.radius > platform.y &&
                ball.y - ball.radius < platform.y + platform.height &&
                ball.x + ball.radius > platform.x &&
                ball.x - ball.radius < platform.x + platform.width
            ) {
                ball.dy = -Math.abs(ball.dy);
                // Изменяем направление в зависимости от места удара
                const hitPoint = (ball.x - platform.x) / platform.width;
                ball.dx = 10 * (hitPoint - 0.5);
            }
            
            // Промах
            if(ball.y + ball.radius > canvas.height) {
                lives--;
                updateScore();
                
                if(lives <= 0) {
                    gameOver();
                } else {
                    resetBall();
                }
            }
            
            // Проверка столкновения с кирпичиками
            bricks.forEach(row => {
                row.forEach(brick => {
                    if(brick.visible) {
                        if(
                            ball.x + ball.radius > brick.x &&
                            ball.x - ball.radius < brick.x + brick.width &&
                            ball.y + ball.radius > brick.y &&
                            ball.y - ball.radius < brick.y + brick.height
                        ) {
                            ball.dy *= -1;
                            brick.visible = false;
                            score += 10;
                            updateScore();
                            
                            // Проверка победы
                            if(score >= brickRowCount * brickColumnCount * 10) {
                                winGame();
                            }
                        }
                    }
                });
            });
        }
        
        // Сброс мяча
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 40;
            ball.dx = 5 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -5;
        }
        
        // Отрисовка игры
        function draw() {
            if(!gameRunning || gamePaused) return;
            
            // Очищаем канвас
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем элементы
            drawBricks();
            drawBall();
            drawPlatform();
            
            // Двигаем элементы
            movePlatform();
            moveBall();
            
            requestAnimationFrame(draw);
        }
        
        // Управление
        function keyDown(e) {
            if(e.key === 'Right' || e.key === 'ArrowRight') {
                platform.dx = platform.speed;
            } else if(e.key === 'Left' || e.key === 'ArrowLeft') {
                platform.dx = -platform.speed;
            } else if(e.key === ' ') {
                if(!gameRunning) startGame();
                else pauseGame();
            }
        }
        
        function keyUp(e) {
            if(
                e.key === 'Right' ||
                e.key === 'ArrowRight' ||
                e.key === 'Left' ||
                e.key === 'ArrowLeft'
            ) {
                platform.dx = 0;
            }
        }
        
        // Управление мышкой
        canvas.addEventListener('mousemove', (e) => {
            if(gameRunning && !gamePaused) {
                const relativeX = e.clientX - canvas.getBoundingClientRect().left;
                if(relativeX > 0 && relativeX < canvas.width) {
                    platform.x = relativeX - platform.width / 2;
                }
            }
        });
        
        // Начать игру
        function startGame() {
            if(!gameRunning) {
                gameRunning = true;
                gamePaused = false;
                score = 0;
                lives = 3;
                createBricks();
                resetBall();
                updateScore();
                document.getElementById('gameOver').classList.remove('show');
                draw();
            }
        }
        
        // Пауза
        function pauseGame() {
            if(gameRunning) {
                gamePaused = !gamePaused;
                if(!gamePaused) {
                    draw();
                }
            }
        }
        
        // Победа
        function winGame() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').classList.add('show');
        }
        
        // Проигрыш
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').classList.add('show');
            document.querySelector('#gameOver h2').textContent = '💔 Игра окончена 💔';
        }
        
        // Рестарт
        function restartGame() {
            gameRunning = false;
            startGame();
        }
        
        // Слушатели событий
        document.addEventListener('keydown', keyDown);
        document.addEventListener('keyup', keyUp);
        
        // Создаем начальные кирпичики
        createBricks();
        
        // Начальная отрисовка
        drawBricks();
        drawBall();
        drawPlatform();
    </script>
</body>
</html>
