<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найди все послания! 💌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .title {
            font-size: 2.5rem;
            color: #c71585;
            margin: 20px 0;
            text-align: center;
            font-style: italic;
        }
        .treasure-map {
            width: 90vw;
            height: 70vh;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23fffaf0"/><path d="M0,0 L100,100 M100,0 L0,100" stroke="%23deb887" stroke-width="0.5"/><circle cx="50" cy="50" r="40" fill="none" stroke="%23deb887" stroke-width="0.5"/></svg>');
            border: 3px solid #deb887;
            border-radius: 10px;
            position: relative;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(139,69,19,0.2);
        }
        .secret-spot {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(199, 21, 133, 0.1);
            border: 2px dashed #c71585;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .secret-spot:hover {
            background: rgba(199, 21, 133, 0.3);
            transform: scale(1.2);
        }
        .secret-spot.found {
            background: #c71585;
            color: white;
            border: 2px solid white;
        }
        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 500px;
            width: 90%;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .message-box.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .message-content {
            font-size: 1.3rem;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
            font-style: italic;
        }
        .close-btn {
            background: #c71585;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            float: right;
        }
        .counter {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1.5rem;
            color: #c71585;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .final-message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.8rem;
            color: #c71585;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s;
        }
        .final-message.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
     <div class="treasure-map" id="treasureMap"></div>
     
    <div class="overlay" id="overlay"></div>
    <div class="message-box" id="messageBox">
        <div class="message-content" id="messageContent"></div>
        <button class="close-btn" onclick="closeMessage()">Закрыть</button>
    </div>
    
    <script>
        const messages = [
            "Твоя улыбка делает мой день лучше ☀️",
            "Когда я с тобой, время летит незаметно ⏳",
            "Ты - самое красивое, что случилось со мной 🌸",
            "Мне нравится, как ты смеёшься 😄",
            "Твои глаза - как две звезды на ночном небе ✨",
            "Я всегда думаю о тебе 💭",
            "Ты делаешь меня счастливее каждый день 🎈",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
            "Я так рад, что ты в моей жизни! 🥰",
        ];
        
        const foundMessages = [];
        let foundCount = 0;
        
        function createSecretSpots() {
            const map = document.getElementById('treasureMap');
            
            // Создаем 8 секретных мест
            for(let i = 0; i < 24; i++) {
                const spot = document.createElement('div');
                spot.className = 'secret-spot';
                spot.dataset.message = messages[i];
                spot.dataset.index = i;
                
                // Случайная позиция (учитывая границы)
                const x = 20 + Math.random() * (map.offsetWidth - 80);
                const y = 20 + Math.random() * (map.offsetHeight - 80);
                spot.style.left = x + 'px';
                spot.style.top = y + 'px';
                
                // Случайный символ
                const symbols = ['💌', '❤️', '💖', '💕', '💞', '💓', '💗', '💘','💌', '❤️', '💖', '💕', '💞', '💓', '💗', '💘','💌', '❤️', '💖', '💕', '💞', '💓', '💗', '💘'];
                spot.textContent = symbols[i];
                
                spot.addEventListener('click', () => {
                    if(!spot.classList.contains('found')) {
                        showMessage(spot.dataset.message, i);
                        spot.classList.add('found');
                        foundCount++;
                        document.getElementById('foundCount').textContent = foundCount;
                        
                        if(foundCount === 8) {
                            setTimeout(() => {
                                document.getElementById('finalMessage').classList.add('show');
                            }, 1000);
                        }
                    }
                });
                
                map.appendChild(spot);
            }
        }
        
        function showMessage(text, index) {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('messageContent').textContent = text;
            document.getElementById('messageBox').classList.add('show');
            
            // Добавляем сердечки вокруг сообщения
            createFloatingHearts();
        }
        
        function closeMessage() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('messageBox').classList.remove('show');
        }
        
        function createFloatingHearts() {
            const hearts = ['❤️', '💖', '💗', '💓', '💞', '💕'];
            
            for(let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.style.position = 'fixed';
                heart.style.fontSize = '25px';
                heart.style.zIndex = '1001';
                heart.style.pointerEvents = 'none';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                
                // Случайная стартовая позиция вокруг центра
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 100;
                const startX = window.innerWidth / 2 + Math.cos(angle) * distance;
                const startY = window.innerHeight / 2 + Math.sin(angle) * distance;
                
                heart.style.left = startX + 'px';
                heart.style.top = startY + 'px';
                
                document.body.appendChild(heart);
                
                // Анимация к центру
                const animation = heart.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${window.innerWidth/2 - startX}px, ${window.innerHeight/2 - startY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.215, 0.61, 0.355, 1)'
                });
                
                animation.onfinish = () => heart.remove();
            }
        }
        
        // Закрытие по клику на оверлей
        document.getElementById('overlay').addEventListener('click', closeMessage);
        
        createSecretSpots();
    </script>
</body>
</html>
